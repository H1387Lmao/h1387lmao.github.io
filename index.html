<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anoto To?</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
<!-- Howler.js: streams audio via the native <audio> element (HTTP range requests) instead of
     decoding the whole file up front, so short clips start playing almost instantly. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #08060a;
  --accent-bocchi: #eeb8c4;
  --accent-nijika: #e6d47b;
  --accent-ryo:    #3a8cc8;
  --accent-ikuyo:  #e05555;
  --ease: cubic-bezier(.22,1,.36,1);
  --ease-soft: cubic-bezier(.4,0,.2,1);
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background:
    radial-gradient(circle at 18% 24%, rgba(238,184,196,.09), transparent 42%),
    radial-gradient(circle at 82% 20%, rgba(58,140,200,.09), transparent 45%),
    radial-gradient(circle at 55% 88%, rgba(230,212,123,.06), transparent 50%),
    var(--bg);
  background-size: 180% 180%;
  animation: bgdrift 34s ease-in-out infinite alternate;
  font-family: 'M PLUS Rounded 1c', sans-serif;
}
@keyframes bgdrift {
  0%   { background-position: 0% 10%, 100% 0%, 40% 100%; }
  100% { background-position: 15% 30%, 75% 35%, 65% 75%; }
}

#app {
  display: flex;
  width: 200vw;
  height: 100vh;
  transition: transform 0.5s var(--ease);
}
#app.open { transform: translateX(-360px); }

#stage-wrap {
  position: relative;
  width: 100vw;
  flex-shrink: 0;
  height: 100vh;
  overflow: hidden;
  background:
    radial-gradient(circle at 30% 20%, rgba(255,79,163,.05), transparent 40%),
    radial-gradient(circle at 75% 75%, rgba(58,140,200,.05), transparent 45%),
    #0b0910;
  background-size: 160% 160%;
  animation: bgdrift 26s ease-in-out infinite alternate;
}
#stage-img {
  position: absolute;
  inset: 0;
  width: 100%; height: 100%;
  object-fit: contain;
  object-position: center;
  pointer-events: none;
  z-index: 1;
  transform-origin: center;
  animation: slowzoom 24s ease-in-out infinite;
}
@keyframes slowzoom { 0%,100%{ transform: scale(1); } 50%{ transform: scale(1.035); } }

#stage-wrap::after {
  content: '';
  position: absolute; inset: 0;
  pointer-events: none;
  z-index: 2;
  background: radial-gradient(ellipse at center,
    transparent 35%, rgba(0,0,0,.3) 65%, rgba(0,0,0,.75) 100%);
}
#scene {
  position: absolute; inset: 0;
  z-index: 3;
  transition: transform .5s var(--ease-soft);
  will-change: transform;
}

.char {
  position: absolute;
  pointer-events: none;
  user-select: none;
  opacity: 0;
  animation: charIn .8s var(--ease) both;
}
#char-ryo    { animation-delay: .05s; }
#char-ikuyo  { animation-delay: .2s; }
#char-nijika { animation-delay: .35s; }
#char-bocchi { animation-delay: .5s; }
@keyframes charIn {
  from { opacity: 0; transform: translateY(26px) scale(.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.char img { display: block; animation: idlefloat 4.2s ease-in-out infinite; transition: filter .3s var(--ease-soft); }
#char-ryo img    { animation-delay: 0s;   }
#char-ikuyo img  { animation-delay: .5s;  }
#char-nijika img { animation-delay: 1s;   }
#char-bocchi img { animation-delay: 1.5s; }
@keyframes idlefloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }

#char-bocchi { --glow: var(--accent-bocchi); }
#char-nijika { --glow: var(--accent-nijika); }
#char-ryo    { --glow: var(--accent-ryo); }
#char-ikuyo  { --glow: var(--accent-ikuyo); }

.char:hover img { filter: drop-shadow(0 0 22px var(--glow)); }

.chars-dimmed .char        { filter: brightness(0.2) saturate(0.2); }
.chars-dimmed .char.active { filter: none; }

.char.active::after {
  content: '';
  position: absolute; bottom: -4px; left: 50%;
  transform: translateX(-50%);
  width: 70%; height: 18px;
  background: radial-gradient(ellipse, rgba(0,0,0,.7) 0%, transparent 72%);
  border-radius: 50%; filter: blur(3px);
}
.char.active img { animation: charfloat 2.8s ease-in-out infinite; }
@keyframes charfloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }

.hitbox {
  position: absolute;
  width: 70%; height: 100%;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  pointer-events: auto;
  cursor: pointer;
  z-index: 10;
}

#hint {
  position: absolute;
  bottom: 6%; left: 50%;
  transform: translateX(-50%);
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; letter-spacing: .3em; text-transform: uppercase;
  color: rgba(255,220,220,.45);
  pointer-events: none; white-space: nowrap;
  transition: opacity .4s;
  animation: hpulse 3s ease-in-out infinite;
  opacity: 0;
  animation: hintIn .8s var(--ease) .9s both, hpulse 3s ease-in-out 1.7s infinite;
}
#hint .hint-chevron { animation: chevbounce 1.6s ease-in-out infinite; }
@keyframes hintIn { from{opacity:0; transform:translate(-50%,6px);} to{opacity:1; transform:translate(-50%,0);} }
@keyframes hpulse { 0%,100%{opacity:.45} 50%{opacity:.85} }
@keyframes chevbounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(3px)} }

#panel {
  position: relative;
  width: 360px;
  flex-shrink: 0;
  height: 100vh;
  overflow: hidden;
  background: rgba(9,6,13,0.9);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  border-left: 1px solid rgba(160,60,60,.3);
}

#panel::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px; z-index: 5;
  background: linear-gradient(90deg, transparent, #eeb8c4, #e6d47b, #3a4664, transparent);
  background-size: 200% 100%;
  animation: sheen 6s linear infinite;
}
@keyframes sheen { 0%{background-position:0% 0} 100%{background-position:200% 0} }

#panel::after {
  content: '';
  position: absolute; inset: 0;
  pointer-events: none;
  z-index: 0;
  background: radial-gradient(ellipse 60% 40% at 100% 0%, color-mix(in srgb, var(--cc, #cc3333) 14%, transparent), transparent 70%);
  opacity: .8;
}

#panel-header {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 120px;
  padding: 32px 24px 0;
  z-index: 2;
}
#panel-close {
  position: absolute; top: 14px; right: 14px;
  width: 28px; height: 28px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 50%;
  color: rgba(255,255,255,.5);
  font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .2s, color .2s, transform .2s;
}
#panel-close:hover { background: rgba(200,40,40,.35); color: #fff; transform: rotate(90deg); }

#char-name {
  font-family: 'Dela Gothic One', sans-serif;
  font-size: 22px; color: #fff;
  letter-spacing: .05em; margin-bottom: 3px;
  opacity: 0;
  animation: fadeUp .5s var(--ease) .1s forwards;
}
#char-role {
  font-size: 10px; letter-spacing: .25em; text-transform: uppercase;
  opacity: 0;
  animation: fadeUp .5s var(--ease) .2s forwards;
}
@keyframes fadeUp { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

#tab-bar {
  position: absolute;
  top: 120px; left: 0; right: 0;
  height: 42px;
  display: flex;
  align-items: flex-end;
  border-bottom: 1px solid rgba(160,60,60,.25);
  padding: 0 16px;
  gap: 4px;
  z-index: 2;
  background: transparent;
  overflow-x: auto;
  scrollbar-width: none;
}
#tab-bar::-webkit-scrollbar { display: none; }

.tab-btn {
  position: relative;
  background: none; border: none;
  margin-bottom: -1px;
  padding: 8px 12px;
  font-family: 'M PLUS Rounded 1c', sans-serif;
  font-size: 11px; letter-spacing: .15em; text-transform: uppercase;
  color: rgba(200,160,160,.45);
  cursor: pointer;
  transition: color .2s;
  white-space: nowrap;
}
.tab-btn:hover  { color: rgba(200,160,160,.8); }
.tab-btn.active { color: #fff; }
.tab-btn:focus-visible, #panel-close:focus-visible, .expand-btn:focus-visible {
  outline: 2px solid rgba(255,255,255,.6);
  outline-offset: 2px;
  border-radius: 3px;
}

.tab-indicator {
  position: absolute;
  bottom: -1px; left: 0;
  height: 2px; width: 0;
  border-radius: 2px;
  background: var(--cc, #cc3333);
  box-shadow: 0 0 10px var(--cc, #cc3333);
  transition: transform .4s var(--ease), width .4s var(--ease);
}

.kessoku-stat {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(255, 79, 163, 0.06);
  border: 1px solid rgba(255, 79, 163, 0.2);
  border-radius: 12px;
  padding: 10px 14px;
  margin-bottom: 14px;
}
.kessoku-stat-icon {
  font-size: 20px;
  flex-shrink: 0;
}
.kessoku-stat-info { flex: 1; min-width: 0; }
.kessoku-stat-value {
  font-family: 'Dela Gothic One', sans-serif;
  font-size: 18px;
  color: #ff4fa3;
  line-height: 1;
  margin-bottom: 2px;
}
.kessoku-stat-label {
  font-size: 10px;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: rgba(200,160,160,.5);
}
.kessoku-stat-sub {
  font-size: 10px;
  color: rgba(200,160,160,.35);
  white-space: nowrap;
}

#page-content {
  position: absolute;
  top: 162px;
  left: 0; right: 0; bottom: 0;
  overflow-y: auto;
  padding: 22px 24px 32px;
  color: #e8d8d8;
  font-size: 14px;
  line-height: 1.85;
  scrollbar-width: thin;
  scrollbar-color: rgba(160,50,50,.35) transparent;
  z-index: 1;
}
#page-content::-webkit-scrollbar { width: 3px; }
#page-content::-webkit-scrollbar-thumb { background: rgba(160,50,50,.4); border-radius: 2px; }

#page-content.content-anim { animation: contentIn .45s var(--ease) both; }
@keyframes contentIn { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

#page-content h3 {
  font-family: 'Dela Gothic One', sans-serif;
  font-size: 14px; color: #fff; letter-spacing: .06em;
  margin: 20px 0 8px;
}
#page-content h3:first-child { margin-top: 0; }
#page-content h4 {
  font-family: 'M PLUS Rounded 1c', sans-serif;
  font-size: 12px; font-weight: 700;
  color: rgba(255,255,255,.6);
  letter-spacing: .1em; text-transform: uppercase;
  margin: 14px 0 6px;
}
#page-content p  { margin-bottom: 10px; color: #d8c8c8; }
#page-content ul { padding-left: 18px; margin-bottom: 10px; }
#page-content li { margin-bottom: 4px; color: #d8c8c8; }
#page-content em { color: #e8aaaa; font-style: italic; }
#page-content strong { color: #fff; }

.tag {
  display: inline-block;
  padding: 2px 9px; margin: 2px 3px 2px 0;
  font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
  border-radius: 3px;
  border: 1px solid rgba(160,60,60,.4);
  background: rgba(160,40,40,.15);
  color: rgba(210,140,140,.9);
  transition: transform .2s var(--ease-soft);
}
.tag:hover { transform: translateY(-1px); }

.stat-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.stat-label {
  font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
  color: rgba(200,160,160,.55); width: 85px; flex-shrink: 0;
}
.stat-bar-wrap {
  flex: 1; height: 4px;
  background: rgba(255,255,255,.08);
  border-radius: 2px; overflow: hidden;
}
.stat-bar {
  height: 100%; border-radius: 2px;
  background: #e05555;
  transition: width .8s var(--ease);
}

.anime-library {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.anime-card {
  position: relative;
  overflow: hidden;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.06);
  background: rgba(255,255,255,0.03);
  transition: border-color .25s, background .25s, transform .25s var(--ease-soft);
  opacity: 0;
  animation: cardIn .5s var(--ease) both;
}
@keyframes cardIn { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
.anime-card:hover {
  border-color: rgba(255,255,255,0.11);
  background: rgba(255,255,255,0.05);
  transform: translateY(-2px);
}

.anime-card-glow {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity .3s;
  pointer-events: none;
  border-radius: 16px;
}
.anime-card:hover .anime-card-glow { opacity: 1; }

.anime-card-inner {
  position: relative;
  display: flex;
  gap: 14px;
  padding: 14px;
}

.anime-cover-wrap {
  position: relative; flex-shrink: 0;
  display: flex;
  align-items: center;
}
.anime-cover {
  width: 74px;
  height: 74px;
  object-fit: cover;
  border-radius: 10px;
  display: block;
}

.anime-info { flex: 1; min-width: 0; }

.anime-title {
  font-family: 'Dela Gothic One', sans-serif;
  font-size: 13px;
  color: #fff;
  letter-spacing: .02em;
  margin-bottom: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.anime-badges {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.anime-badge {
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .05em;
  text-transform: uppercase;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.07);
  color: rgba(220,200,200,.8);
}

.anime-progress-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 5px;
}
.anime-progress-label {
  font-size: 10px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: rgba(200,160,160,.5);
}
.anime-progress-track {
  width: 100%;
  height: 5px;
  background: rgba(255,255,255,.07);
  border-radius: 999px;
  overflow: hidden;
}
.anime-progress-fill {
  height: 100%;
  border-radius: 999px;
  transition: width .8s var(--ease);
}

.anime-meta {
  margin-top: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.anime-meta-pill {
  background: rgba(255,255,255,0.04);
  border-radius: 6px;
  padding: 3px 8px;
  font-size: 11px;
  color: #c8b8b8;
}
.anime-timestamp {
  font-size: 11px;
  color: rgba(200,160,160,.45);
}

.anime-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 6px;
}
.anime-title-row .anime-title {
  margin-bottom: 0;
  flex: 1;
  min-width: 0;
}
.anime-rating {
  display: flex;
  align-items: center;
  gap: 3px;
  flex-shrink: 0;
  padding: 3px 7px;
  border-radius: 8px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.07);
}

.anime-footer-row {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-top: 8px;
  flex-direction: column;
}

.song-player {
  display: flex;
  align-items: center;
  gap: 7px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 8px;
  padding: 5px 9px 5px 6px;
  flex: 1;
  min-width: 0;
  max-width: 175px;
}
.song-play-btn {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--song-accent, #cc3333);
  border: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: #fff;
  flex-shrink: 0;
  transition: transform .15s, opacity .15s;
}
.song-play-btn:hover { transform: scale(1.1); opacity: .85; }
.song-info { min-width: 0; }
.song-title {
  font-size: 11px; font-weight: 700;
  color: rgba(255,255,255,.8);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.song-artist {
  font-size: 10px;
  color: rgba(200,160,160,.5);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

a {
  text-decoration: none;
}

.expand-btn {
  display: flex; align-items: center; gap: 4px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.09);
  border-radius: 8px;
  padding: 5px 10px;
  color: var(--exp-color, rgba(200,160,160,.7));
  font-family: 'M PLUS Rounded 1c', sans-serif;
  font-size: 11px; letter-spacing: .06em;
  cursor: pointer;
  transition: background .2s, border-color .2s;
  white-space: nowrap;
  flex-shrink: 0;
  text-decoration: none;
}
.expand-btn:hover { background: rgba(255,255,255,0.09); }
.expand-chevron {
  transition: transform .25s var(--ease);
}
.expand-chevron.rotated { transform: rotate(180deg); }

.seasons-panel {
  padding: 0 14px 14px;
  animation: contentIn .35s var(--ease) both;
}
.seasons-divider {
  height: 1px;
  margin-bottom: 12px;
  border-radius: 1px;
}
.seasons-list { display: flex; flex-direction: column; gap: 10px; }
.season-row {}
.season-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 4px;
}
.season-title {
  font-size: 11px; font-weight: 700;
  color: rgba(255,255,255,.7);
  flex: 1; min-width: 0;
}
.season-note {
  font-size: 10px;
  color: rgba(200,160,160,.4);
  white-space: nowrap;
  flex-shrink: 0;
}
.season-progress-wrap {
  display: flex; align-items: center; gap: 8px;
}
.season-progress-track {
  flex: 1; height: 3px;
  background: rgba(255,255,255,.06);
  border-radius: 999px; overflow: hidden;
}
.season-progress-fill {
  height: 100%; border-radius: 999px;
  transition: width .8s var(--ease);
}
.season-ep-count {
  font-size: 10px;
  color: rgba(200,160,160,.4);
  white-space: nowrap;
  flex-shrink: 0;
  min-width: 36px;
  text-align: right;
}
.seasons-count {
  border-width: 1px;
  border-style: solid;
}
.anime-card.expanded {
  border-color: rgba(255,255,255,0.1);
}

.lastfm-widget {
  background: rgba(210, 40, 40, 0.06);
  border: 1px solid rgba(210, 40, 40, 0.22);
  border-radius: 14px;
  padding: 12px 14px;
  margin-bottom: 18px;
}
.lastfm-header {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 10px;
}
.lastfm-logo {
  width: 16px; height: 16px;
  flex-shrink: 0;
}
.lastfm-label {
  font-size: 10px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: rgba(210,100,100,.7);
  flex: 1;
}
.lastfm-username {
  font-size: 10px;
  color: rgba(200,160,160,.4);
  letter-spacing: .05em;
}
.lastfm-tracks {
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.lastfm-track {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 9px;
  border-radius: 9px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.05);
  transition: background .2s;
  text-decoration: none;
}
.lastfm-track:hover { background: rgba(255,255,255,0.06); }
.lastfm-track-art {
  width: 36px; height: 36px;
  border-radius: 6px;
  object-fit: cover;
  flex-shrink: 0;
  background: rgba(255,255,255,0.06);
}
.lastfm-track-art-placeholder {
  width: 36px; height: 36px;
  border-radius: 6px;
  flex-shrink: 0;
  background: rgba(255,255,255,0.06);
  display: flex; align-items: center; justify-content: center;
  color: rgba(255,255,255,.2);
  font-size: 16px;
}
.lastfm-track-info { flex: 1; min-width: 0; }
.lastfm-track-name {
  font-size: 12px; font-weight: 700;
  color: rgba(255,255,255,.88);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 2px;
}
.lastfm-track-artist {
  font-size: 10px;
  color: rgba(200,160,160,.5);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.lastfm-track-time {
  font-size: 10px;
  color: rgba(200,160,160,.35);
  flex-shrink: 0;
  white-space: nowrap;
}
.lastfm-now-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #e05555;
  flex-shrink: 0;
  animation: lfpulse 1.4s ease-in-out infinite;
}

.quiz-intro { font-size: 12px; color: rgba(200,160,160,.6); margin-bottom: 2px; }

.quiz-disc {

.quiz-disc::before {

.quiz-disc.spinning { animation: quizspin 2.6s linear infinite; }
@keyframes quizspin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
.quiz-play-btn {
  width: 54px; height: 54px; border-radius: 50%;

.quiz-play-btn:hover { transform: scale(1.08); }
.quiz-play-btn:disabled { opacity: .35; cursor: default; transform: none; }

.quiz-progress { display: flex; gap: 6px; }
.quiz-dot {
  flex: 1;

.quiz-guess-row { position: relative; display: flex; gap: 8px; }

  flex: 1; min-width: 0;

let currentAudio = null;
let currentSongBtn = null;

function playSong(btn, url, franchiseId) {
  if (currentAudio && !currentAudio.paused && currentSongBtn === btn) {
    currentAudio.pause();
    btn.innerHTML = getSongIcon('play');
    currentSongBtn = null;
    return;
  }
  if (currentAudio) {
    currentAudio.pause();
    if (currentSongBtn) currentSongBtn.innerHTML = getSongIcon('play');
  }
  currentAudio = new Audio(url);
  currentAudio.volume = 0.7;
  currentAudio.play().catch(() => {});
  btn.innerHTML = getSongIcon('pause');
  currentSongBtn = btn;
  currentAudio.onended = () => {
    btn.innerHTML = getSongIcon('play');
    currentSongBtn = null;
  };
}

function getSongIcon(state) {
  return state === 'play'

function formatDate(dateString) {
  const date = new Date(dateString);
  return new Intl.DateTimeFormat(navigator.language, { dateStyle:"medium", timeStyle:"short" }).format(date);
}

function relativeTime(dateString) {
  const diff = new Date() - new Date(dateString);
  const days = Math.floor(diff / (1000*60*60*24));
  if (days <= 0) return `${Math.floor(diff/(1000*60*60))} hours ago`;
  if (days === 1) return "1 day ago";
  return `${days} days ago`;
}

function buildStarRating(rating, accentColor) {
  const filled = Math.round(rating * 2) / 2; // round to .5
  const ratingColor = rating >= 9 ? '#f7d44c' : rating >= 7 ? '#a8d8a8' : '#e05555';
  return `
    <div class="anime-rating" style="color:${ratingColor}">
      <svg viewBox="0 0 12 12" fill="currentColor" width="11" height="11" style="vertical-align:-1px">
        <polygon points="6,1 7.5,4.5 11,5 8.5,7.5 9.2,11 6,9.2 2.8,11 3.5,7.5 1,5 4.5,4.5"/>
      </svg>
      <span style="font-size:12px;font-weight:700;letter-spacing:.03em">${rating.toFixed(1)}</span>
      <span style="font-size:10px;color:rgba(255,255,255,0.25)">/10</span>
    </div>`;
}

function hexToRgba(hex, alpha = 1) {
  hex = hex.replace(/^#/, '');
  if (hex.length === 3) hex = hex.split('').map(c => c+c).join('');
  const r = parseInt(hex.substring(0,2),16);
  const g = parseInt(hex.substring(2,4),16);
  const b = parseInt(hex.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function getRect() {
  const sw = document.getElementById('stage-wrap');
  const ww = sw.clientWidth, wh = sw.clientHeight;
  const a = IMG_W/IMG_H, wa = ww/wh;
  let iw,ih,ox,oy;
  if (wa>a){ih=wh;iw=ih*a;oy=0;ox=(ww-iw)/2;}
  else{iw=ww;ih=iw/a;ox=0;oy=(wh-ih)/2;}
  return {ox,oy,iw,ih};
}

function positionChars() {
  const {ox,oy,iw,ih} = getRect();
  for (const [id,l] of Object.entries(LAYOUT)) {
    const el = document.getElementById('char-'+id);
    const img = el.querySelector('img');
    const ch = ih*l.h;
    img.style.height = ch+'px';
    el.style.left   = (ox+l.x*iw)+'px';
    el.style.top    = (oy+l.y*ih-ch)+'px';
    el.style.zIndex = l.z;
  }
}

function applyTagColors(container, color) {

}

// Animate progress/stat bars from 0 to their target width whenever new content mounts
function animateBars(container) {
  const bars = container.querySelectorAll('.stat-bar, .anime-progress-fill, .season-progress-fill');
  bars.forEach(b => {
    const target = b.style.width;
    b.style.width = '0%';
    requestAnimationFrame(() => requestAnimationFrame(() => { b.style.width = target; }));
  });
}

// Restart the page-content entrance animation on every render
function refreshContentAnim(pc) {
  pc.classList.remove('content-anim');
  void pc.offsetWidth;
  pc.classList.add('content-anim');
}

function positionIndicator(btn) {
  const ind = document.getElementById('tab-indicator');
  if (!ind || !btn) return;
  ind.style.width = btn.offsetWidth + 'px';
  ind.style.transform = `translateX(${btn.offsetLeft}px)`;
}

function openChar(id) {
  if (current === id) { closePanel(); return; }
  current = id;
  const d = CHARS[id];
  const tabs = Object.keys(d.tabs);

  document.querySelectorAll('.char').forEach(c => c.classList.remove('active'));
  document.getElementById('char-'+id).classList.add('active');
  document.getElementById('scene').classList.add('chars-dimmed');

  document.getElementById('char-name').textContent = d.name;
  const roleEl = document.getElementById('char-role');
  roleEl.textContent = d.role;
  roleEl.style.color = d.color;
  document.getElementById('panel').style.setProperty('--cc', d.color);

  document.getElementById('tab-bar').innerHTML = tabs.map((t,i) =>
    `<button class="tab-btn${i===0?' active':''}" onclick="switchTab('${t}',this)">${t}</button>`
  ).join('') + '<div id="tab-indicator" class="tab-indicator"></div>';
  positionIndicator(document.querySelector('#tab-bar .tab-btn.active'));

  const pc = document.getElementById('page-content');
  pc.innerHTML = getTabContent(id, tabs[0]);
  applyTagColors(pc, d.color);
  animateBars(pc);
  refreshContentAnim(pc);

  document.getElementById('app').classList.add('open');
  document.getElementById('hint').style.opacity = '0';
  if (id === 'bocchi') setTimeout(loadLastfm, 0);
  if (id === 'ikuyo') setTimeout(loadKessokuStat, 0);
}

function switchTab(name, btn) {
  const d = CHARS[current];
  if (!d) return;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  positionIndicator(btn);
  const pc = document.getElementById('page-content');
  pc.innerHTML = getTabContent(current, name);
  pc.scrollTop = 0;
  applyTagColors(pc, d.color);
  animateBars(pc);
  refreshContentAnim(pc);
  if (name === 'Interests') setTimeout(loadLastfm, 0);
}

function closePanel() {
  current = null;
  document.getElementById('app').classList.remove('open');
  document.getElementById('scene').classList.remove('chars-dimmed');
  document.querySelectorAll('.char').forEach(c => c.classList.remove('active'));
  setTimeout(() => document.getElementById('hint').style.opacity = '', 420);
}

const LASTFM_API_KEY  = 'cb7d6f9cb5a35e63b4cfb3890d9ad871';
const LASTFM_USERNAME = 'Noto_-';
const LASTFM_LIMIT    = 5;

function timeSince(unixTs) {
  const diff = Math.floor(Date.now() / 1000) - parseInt(unixTs, 10);
  if (diff < 60)  return 'just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  return Math.floor(diff/86400) + 'd ago';
}

async function loadLastfm() {
  const container = document.getElementById('lastfm-tracks');
  if (!container) return;

  try {
    const url = `https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${encodeURIComponent(LASTFM_USERNAME)}&api_key=${LASTFM_API_KEY}&format=json&limit=${LASTFM_LIMIT}`;
    const res  = await fetch(url);
    const data = await res.json();

    if (data.error) {
      container.innerHTML = `<div class="lastfm-error">Last.fm error: ${data.message}</div>`;
      return;
    }

    const tracks = data.recenttracks?.track || [];
    if (!tracks.length) {
      container.innerHTML = `<div class="lastfm-error">No recent tracks found.</div>`;
      return;
    }

    container.innerHTML = tracks.map((t, i) => {
      const isNow = t['@attr']?.nowplaying === 'true';
      const art   = t.image?.find(img => img.size === 'medium')?.['#text'];
      const artEl = art
        ? `<img class="lastfm-track-art" src="${art}" alt="" loading="lazy">`
        : `<div class="lastfm-track-art-placeholder">♪</div>`;
      const timeEl = isNow
        ? `<div class="lastfm-now-dot"></div>`
        : `<div class="lastfm-track-time">${timeSince(t.date?.uts)}</div>`;
      return `
        <a class="lastfm-track" href="${t.url}" target="_blank" rel="noopener">
          ${artEl}
          <div class="lastfm-track-info">
            <div class="lastfm-track-name">${t.name}</div>
            <div class="lastfm-track-artist">${t.artist?.['#text'] || ''}</div>
          </div>
          ${timeEl}
        </a>`;
    }).join('');
  } catch (e) {
    container.innerHTML = `<div class="lastfm-error">Could not reach Last.fm.</div>`;
  }
}

async function loadKessokuStat() {
  try {
    const url = `https://ws.audioscrobbler.com/2.0/?method=library.getartists&user=${encodeURIComponent(LASTFM_USERNAME)}&api_key=${LASTFM_API_KEY}&format=json&limit=200`;
    const res  = await fetch(url);
    const data = await res.json();
    const artists = data.artists?.artist || [];
    const kb = artists.find(a => a.name.toLowerCase() === 'kessoku band');
    const el = document.getElementById('kessoku-minutes');
    const sub = document.getElementById('kessoku-scrobbles');
    if (!el) return;
    if (kb) {
      const plays = parseInt(kb.playcount, 10);
      const mins  = Math.round(plays * 3.5);
      el.textContent  = mins.toLocaleString();
      sub.textContent = plays.toLocaleString() + ' scrobbles';
    } else {
      el.textContent = 'No data';
    }
  } catch(e) {
    const el = document.getElementById('kessoku-minutes');
    if (el) el.textContent = '—';
  }
}

<script>
/* =====================================================================
   MUSIC QUIZ — "guess the song from a short clip" minigame
   - Songs are read from music/manifest.json, a plain JSON array of the
     mp3 filenames sitting in the music/ folder, each named
     "JapaneseName(EnglishName).mp3". Run generate_manifest.py (included
     alongside this file) any time you add/remove songs, then re-upload
     music/manifest.json.
   - Audio playback uses Howler.js in html5 mode, which plays through the
     native <audio> element instead of fetching + decoding the whole file
     into a buffer first. That means the browser streams just the bytes
     it needs (most static hosts support HTTP range requests), so a
     0.5s clip starts almost instantly instead of waiting on the full
     song to download.
   - Settings (language / hard mode) and past-game stats are both kept
     in cookies, so they persist across visits on this browser.
   ===================================================================== */

// ---- reveal schedules -------------------------------------------------
// Both modes use the same reveal schedule (the classic Heardle timings, 6 tries).
// Normal mode always plays from the start of the song. Hard mode plays the exact
// same-length clips, but from a random point in the song instead of the intro —
// and disables the autocomplete dropdown, so you're guessing blind.
const NORMAL_TIMES = [1, 2, 4, 7, 11, 16]; // seconds

// ---- cookies ------------------------------------------------------------
const STATS_COOKIE    = 'musicquiz_stats_v1';
const SETTINGS_COOKIE = 'musicquiz_settings_v1';

function setCookie(name, value, days) {
  let expires = '';
  if (days) {
    const d = new Date();
    d.setTime(d.getTime() + days * 24 * 60 * 60 * 1000);
    expires = '; expires=' + d.toUTCString();
  }
  document.cookie = name + '=' + value + expires + '; path=/; SameSite=Lax';
}
function getCookie(name) {
  const m = document.cookie.match('(^|;\\s*)' + name + '=([^;]*)');
  return m ? m[2] : null;
}

function defaultStats() {
  return {
    played: 0, won: 0, streak: 0, bestStreak: 0,
    buckets: { normal: [0, 0, 0, 0, 0, 0], hard: [0, 0, 0, 0, 0, 0] },
    history: []
  };
}
// Both bucket arrays line up with NORMAL_TIMES (6 slots). If an old cookie has a
// stale shape (e.g. from before hard mode's schedule matched normal mode), it's
// discarded rather than misread.
function normalizeBucket(arr) {
  const out = [0, 0, 0, 0, 0, 0];
  if (Array.isArray(arr) && arr.length === 6) {
    for (let i = 0; i < 6; i++) out[i] = Number(arr[i]) || 0;
  }
  return out;
}
function loadStats() {
  const raw = getCookie(STATS_COOKIE);
  if (!raw) return defaultStats();
  try {
    const parsed = JSON.parse(decodeURIComponent(raw));
    const base = defaultStats();
    return Object.assign(base, parsed, {
      buckets: {
        normal: normalizeBucket(parsed.buckets && parsed.buckets.normal),
        hard:   normalizeBucket(parsed.buckets && parsed.buckets.hard)
      },
      history: parsed.history || []
    });
  } catch (e) { return defaultStats(); }
}
function saveStats(stats) {
  setCookie(STATS_COOKIE, encodeURIComponent(JSON.stringify(stats)), 365);
}
function recordResult(r, attemptIdx) {
  const stats = loadStats();
  stats.played++;
  const modeKey = r.hard ? 'hard' : 'normal';
  if (attemptIdx !== null) {
    stats.won++;
    stats.streak++;
    stats.bestStreak = Math.max(stats.bestStreak, stats.streak);
    stats.buckets[modeKey][attemptIdx] = (stats.buckets[modeKey][attemptIdx] || 0) + 1;
  } else {
    stats.streak = 0;
  }
  stats.history.unshift({ en: r.song.en, jp: r.song.jp, a: attemptIdx, m: modeKey, l: r.lang, t: Date.now() });
  stats.history = stats.history.slice(0, 25);
  saveStats(stats);
}
function resetStats() {
  if (!confirm('Clear all saved music quiz scores?')) return;
  setCookie(STATS_COOKIE, '', -1);
  renderScoresTab();
}

function loadSettings() {
  const raw = getCookie(SETTINGS_COOKIE);
  if (!raw) return { lang: 'en', hard: false };
  try {
    const parsed = JSON.parse(decodeURIComponent(raw));
    return { lang: parsed.lang === 'jp' ? 'jp' : 'en', hard: !!parsed.hard };
  } catch (e) { return { lang: 'en', hard: false }; }
}
function saveSettings() {
  setCookie(SETTINGS_COOKIE, encodeURIComponent(JSON.stringify(settings)), 365);
}

let settings = loadSettings();
let gameTab = 'Play';

// ---- song library ---------------------------------------------------
let SONGS = [];
let songsLoading = false;

function parseSongFile(filename) {
  const name = String(filename);
  // "JapaneseName(EnglishName).mp3"
  const withJp = name.match(/^(.*)\(([^)]*)\)\.mp3$/i);
  if (withJp) {
    const jp = withJp[1].trim(), en = withJp[2].trim();
    if (jp && en) return { jp, en, file: filename };
  }
  // "EnglishName.mp3" — no Japanese title, en-only entry
  const enOnly = name.match(/^(.*)\.mp3$/i);
  if (enOnly) {
    const en = enOnly[1].trim();
    if (en) return { jp: null, en, file: filename };
  }
  return null;
}

async function loadManifest() {
  songsLoading = true;
  if (current === 'game' && gameTab === 'Play') renderPlayTab();
  try {
    const res = await fetch('music/manifest.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('manifest not found');
    const files = await res.json();
    SONGS = files.map(parseSongFile).filter(Boolean);
  } catch (e) {
    console.warn('Music quiz: could not load music/manifest.json — see generate_manifest.py', e);
    SONGS = [];
  }
  songsLoading = false;
  if (current === 'game' && gameTab === 'Play') renderPlayTab();
}

// ---- round state + audio ---------------------------------------------
let round = null;
let currentHowl = null;
let snippetTimer = null;

function stopSnippet() {
  clearTimeout(snippetTimer);
  if (currentHowl) currentHowl.stop();
  const disc = document.getElementById('quiz-disc');
  if (disc) disc.classList.remove('spinning');
}

function startRound() {
  if (!SONGS.length) return;
  stopSnippet();
  if (currentHowl) { currentHowl.unload(); currentHowl = null; }

  // Songs with no Japanese title can't be used when guessing in Japanese.
  const pool = SONGS.filter(s => s[settings.lang]);
  if (!pool.length) {
    round = { empty: true, lang: settings.lang };
    renderPlayTab();
    return;
  }

  const song = pool[Math.floor(Math.random() * pool.length)];
  const hard = settings.hard;
  round = {
    song,
    lang: settings.lang,
    hard,
    times: NORMAL_TIMES.slice(),
    attempt: 0,
    finished: false,
    won: false,
    wrongGuesses: [],
    startOffset: 0,
    ready: !hard // normal mode always starts at 0, so no need to wait on duration
  };
  currentHowl = new Howl({
    src: [`music/${encodeURIComponent(song.file)}`],
    html5: true,     // stream through the native <audio> element (range requests) — no full-file decode
    preload: true,
    volume: 0.8,
    onload: () => {
      if (!round || round.song !== song || !round.hard) return;
      const dur = currentHowl.duration() || 0;
      const maxSnippet = round.times[round.times.length - 1];
      const latestStart = Math.max(0, dur - maxSnippet - 0.25);
      round.startOffset = latestStart > 0 ? Math.random() * latestStart : 0;
      round.ready = true;
      renderPlayTab();
    }
  });
  renderPlayTab();
}

function ensureRound() {
  if (!round) startRound();
}

function playSnippet() {
  if (!round || round.empty || round.finished || !currentHowl || !round.ready) return;
  const dur = round.times[round.attempt];
  clearTimeout(snippetTimer);
  currentHowl.seek(round.startOffset || 0);
  currentHowl.play();
  const disc = document.getElementById('quiz-disc');
  if (disc) disc.classList.add('spinning');
  snippetTimer = setTimeout(() => {
    currentHowl.pause();
    if (disc) disc.classList.remove('spinning');
  }, dur * 1000);
}

function normalize(str) {
  return (str || '')
    .toString()
    .toLowerCase()
    .normalize('NFKC')
    .replace(/[!?.,'’‘"“”\-_:;~〜！？。、・「」『』（）()\[\]]/g, '')
    .replace(/\s+/g, '')
    .trim();
}

function advanceAttempt() {
  round.attempt++;
  if (round.attempt >= round.times.length) {
    round.finished = true;
    round.won = false;
    stopSnippet();
    recordResult(round, null);
  }
  renderPlayTab();
}

function submitGuess(value) {
  if (!round || round.empty || round.finished) return;
  const v = (value || '').trim();
  if (!v) return;
  const target = normalize(round.song[round.lang]);
  const guessN = normalize(v);
  const isCorrect = round.hard
    ? guessN === target
    : (guessN === target || (target.length > 3 && guessN.includes(target)) || (guessN.length > 3 && target.includes(guessN)));

  const input = document.getElementById('quiz-input');
  if (input) input.value = '';
  const box = document.getElementById('quiz-suggestions');
  if (box) { box.classList.remove('open'); box.innerHTML = ''; }

  if (isCorrect) {
    round.finished = true;
    round.won = true;
    stopSnippet();
    recordResult(round, round.attempt);
    renderPlayTab();
    return;
  }
  round.wrongGuesses.push(v);
  advanceAttempt();
}

function skipGuess() {
  if (!round || round.empty || round.finished) return;
  advanceAttempt();
}

function giveUp() {
  if (!round || round.empty || round.finished) return;
  round.finished = true;
  round.won = false;
  stopSnippet();
  recordResult(round, null);
  renderPlayTab();
}

function onGuessInput(value) {
  const box = document.getElementById('quiz-suggestions');
  if (!box || !round || round.empty) return;
  if (round.hard || !value.trim()) { box.classList.remove('open'); box.innerHTML = ''; return; }
  const lang = round.lang;
  const q = normalize(value);
  const seen = new Set();
  const matches = [];
  for (const s of SONGS) {
    const name = s[lang];
    if (!name || seen.has(name)) continue;
    if (normalize(name).includes(q)) { matches.push(name); seen.add(name); }
    if (matches.length >= 8) break;
  }
  if (!matches.length) { box.classList.remove('open'); box.innerHTML = ''; return; }
  box.innerHTML = matches.map(name =>
    `<div class="quiz-suggestion-item" onmousedown="selectSuggestion(${JSON.stringify(name)})">${escapeHtml(name)}</div>`
  ).join('');
  box.classList.add('open');
}
function selectSuggestion(name) {
  // Clicking a suggestion completes the guess text in the input — it doesn't
  // submit for you, so you can still double check before hitting Guess/Enter.
  const input = document.getElementById('quiz-input');
  if (input) { input.value = name; input.focus({ preventScroll: true }); }
  const box = document.getElementById('quiz-suggestions');
  if (box) { box.classList.remove('open'); box.innerHTML = ''; }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function quizPlayIcon() {
  return `<svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><polygon points="6,4 20,12 6,20"/></svg>`;
}

// ---- panel integration -------------------------------------------------
function openGame() {
  if (current === 'game') { closePanel(); return; }
  current = 'game';
  document.querySelectorAll('.char').forEach(c => c.classList.remove('active'));
  document.getElementById('scene').classList.remove('chars-dimmed');

  document.getElementById('char-name').textContent = 'Music Quiz';
  const roleEl = document.getElementById('char-role');
  roleEl.textContent = 'Guess the Song';
  roleEl.style.color = '#e05555';
  document.getElementById('panel').style.setProperty('--cc', '#e05555');

  const tabs = ['Play', 'Settings', 'Scores'];
  document.getElementById('tab-bar').innerHTML = tabs.map((t, i) =>
    `<button class="tab-btn${i === 0 ? ' active' : ''}" onclick="switchGameTab('${t}',this)">${t}</button>`
  ).join('') + '<div id="tab-indicator" class="tab-indicator"></div>';
  positionIndicator(document.querySelector('#tab-bar .tab-btn.active'));

  gameTab = 'Play';
  renderGameTab();

  document.getElementById('app').classList.add('open');
  document.getElementById('hint').style.opacity = '0';

  if (!SONGS.length && !songsLoading) loadManifest();
}

function switchGameTab(name, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  positionIndicator(btn);
  gameTab = name;
  renderGameTab();
}

function renderGameTab() {
  if (gameTab === 'Play') renderPlayTab();
  else if (gameTab === 'Settings') renderSettingsTab();
  else if (gameTab === 'Scores') renderScoresTab();
}

function renderPlayTab() {
  if (current !== 'game' || gameTab !== 'Play') return;
  const pc = document.getElementById('page-content');
  if (!pc) return;

  if (songsLoading) {
    pc.innerHTML = `<h3>Music Quiz</h3><div class="quiz-loading">Loading song library…</div>`;
    refreshContentAnim(pc);
    return;
  }
  if (!SONGS.length) {
    pc.innerHTML = `
      <h3>Music Quiz</h3>
      <p class="quiz-empty">No songs found. Drop mp3s into the <strong>music/</strong> folder named
      <em>JapaneseName(EnglishName).mp3</em>, run <strong>generate_manifest.py</strong> to build
      <strong>music/manifest.json</strong>, then reload.</p>`;
    refreshContentAnim(pc);
    return;
  }

  ensureRound();
  const r = round;

  if (r.empty) {
    const langLabel = r.lang === 'jp' ? 'Japanese' : 'English';
    pc.innerHTML = `
      <h3>Music Quiz</h3>
      <p class="quiz-empty">None of your songs have a ${langLabel} title yet, so there's nothing to
      guess in this language. Switch language in Settings, or rename files to include a
      ${langLabel === 'Japanese' ? 'Japanese name, e.g. JapaneseName(EnglishName).mp3' : 'plain EnglishName.mp3'}.</p>`;
    refreshContentAnim(pc);
    return;
  }

  const langLabel = r.lang === 'jp' ? 'Japanese' : 'English';

  const dotsHtml = r.times.map((t, i) => {
    const cls = i < r.attempt ? 'used' : (i === r.attempt && !r.finished ? 'current' : '');
    return `<div class="quiz-dot ${cls}">${t}s</div>`;
  }).join('');

  const wrongHtml = r.wrongGuesses.length
    ? `<div class="quiz-wrong-list">${r.wrongGuesses.map(g => `<div class="quiz-wrong-chip">${escapeHtml(g)}</div>`).join('')}</div>`
    : '';

  let resultHtml = '';
  if (r.finished) {
    const target = r.song[r.lang];
    const otherLang = r.lang === 'jp' ? r.song.en : r.song.jp;
    resultHtml = `
      <div class="quiz-result ${r.won ? 'win' : 'lose'}">
        <div class="quiz-result-title">${r.won ? 'Correct!' : 'Out of attempts'}</div>
        <div class="quiz-result-sub"><b>${escapeHtml(target)}</b>${otherLang ? ` <span style="opacity:.55">(${escapeHtml(otherLang)})</span>` : ''}${r.won ? ` — guessed at ${r.times[r.attempt]}s` : ''}</div>
      </div>
      <button class="quiz-newsong-btn" onclick="startRound()">Next Song</button>`;
  }

  pc.innerHTML = `
    <h3>Music Quiz</h3>
    <div class="quiz-intro">${r.hard ? 'Hard mode — random start point' : 'Normal mode'} · guessing in ${langLabel}</div>
    <div class="quiz-wrap">
      <div class="quiz-visual">
        <button class="quiz-play-btn" id="quiz-play-btn" onclick="playSnippet()" ${r.finished || !r.ready ? 'disabled' : ''}>${quizPlayIcon()}</button>
        <div class="quiz-disc" id="quiz-disc">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><circle cx="12" cy="12" r="2.4"/></svg>
        </div>
      </div>
      ${!r.ready ? '<div class="quiz-loading" style="padding:0 0 4px;">Cueing a random start point…</div>' : ''}
      <div class="quiz-progress">${dotsHtml}</div>
      ${!r.finished ? `
      <div class="quiz-guess-row">
        <input type="text" class="quiz-input" id="quiz-input" autocomplete="off"
          placeholder="Type the ${langLabel} title…"
          oninput="onGuessInput(this.value)"
          onkeydown="if(event.key==='Enter'){event.preventDefault();submitGuess(document.getElementById('quiz-input').value);}">
        <div class="quiz-suggestions" id="quiz-suggestions"></div>
        <button class="quiz-submit-btn" onclick="submitGuess(document.getElementById('quiz-input').value)">Guess</button>
      </div>
      <div class="quiz-actions">
        <button class="expand-btn" onclick="skipGuess()">Skip ▸</button>
        <button class="expand-btn" onclick="giveUp()">Give up</button>
      </div>` : ''}
      ${wrongHtml}
      ${resultHtml}
    </div>
  `;
  refreshContentAnim(pc);
  const input = document.getElementById('quiz-input');
  if (input) input.focus({ preventScroll: true });
}

function renderSettingsTab() {
  const pc = document.getElementById('page-content');
  if (!pc) return;
  pc.innerHTML = `
    <h3>Settings</h3>
    <p class="quiz-settings-desc" style="margin:-4px 0 14px;">Changes apply starting with your next song.</p>

    <div class="quiz-settings-block">
      <div class="quiz-settings-label">Language to guess in</div>
      <div class="quiz-segmented">
        <button class="${settings.lang === 'en' ? 'active' : ''}" onclick="setLang('en')">English</button>
        <button class="${settings.lang === 'jp' ? 'active' : ''}" onclick="setLang('jp')">Japanese</button>
      </div>
    </div>

    <div class="quiz-settings-block">
      <div class="quiz-toggle-row">
        <div class="quiz-toggle-copy">
          <div class="quiz-toggle-title">Hard mode</div>
          <div class="quiz-toggle-desc">Same clip lengths, but each one starts from a random point in the song instead of the intro — plus free-text guessing only, no autocomplete.</div>
        </div>
        <div class="quiz-switch ${settings.hard ? 'on' : ''}" onclick="setHard(${!settings.hard})"></div>
      </div>
    </div>
  `;
  refreshContentAnim(pc);
}
function setLang(l) { settings.lang = l; saveSettings(); renderSettingsTab(); }
function setHard(v) { settings.hard = v; saveSettings(); renderSettingsTab(); }

function renderScoresTab() {
  const pc = document.getElementById('page-content');
  if (!pc) return;
  const stats = loadStats();
  const winPct = stats.played ? Math.round((stats.won / stats.played) * 100) : 0;
  const normalBuckets = stats.buckets.normal;
  const hardBuckets = stats.buckets.hard;
  const maxNormal = Math.max(1, ...normalBuckets);
  const maxHard = Math.max(1, ...hardBuckets);

  const distHtml = (buckets, times, max) => buckets.map((c, i) => `
    <div class="quiz-dist-row">
      <div class="quiz-dist-label">${times[i]}s</div>
      <div class="quiz-dist-track"><div class="quiz-dist-fill" style="width:${(c / max) * 100}%"></div></div>
      <div class="quiz-dist-count">${c}</div>
    </div>`).join('');

  const historyHtml = stats.history.length ? stats.history.map(h => `
    <div class="quiz-history-item">
      <div class="quiz-history-result ${h.a !== null ? 'win' : 'lose'}">${h.a !== null ? '✓' : '✕'}</div>
      <div class="quiz-history-info">
        <div class="quiz-history-name">${escapeHtml(h.l === 'jp' ? h.jp : h.en)}</div>
        <div class="quiz-history-meta">${h.m === 'hard' ? 'Hard' : 'Normal'} · ${h.l === 'jp' ? 'JP' : 'EN'}${h.a !== null ? ' · solved at ' + NORMAL_TIMES[h.a] + 's' : ''}</div>
      </div>
    </div>`).join('') : '<p class="quiz-empty">No games played yet.</p>';

  pc.innerHTML = `
    <h3>Your Scores</h3>
    <div class="quiz-stats-grid" style="margin-bottom:18px;">
      <div class="quiz-stat-card"><div class="quiz-stat-value">${stats.played}</div><div class="quiz-stat-label">Played</div></div>
      <div class="quiz-stat-card"><div class="quiz-stat-value">${winPct}%</div><div class="quiz-stat-label">Win rate</div></div>
      <div class="quiz-stat-card"><div class="quiz-stat-value">${stats.streak}</div><div class="quiz-stat-label">Current streak</div></div>
      <div class="quiz-stat-card"><div class="quiz-stat-value">${stats.bestStreak}</div><div class="quiz-stat-label">Best streak</div></div>
    </div>

    <h4>Solved-at distribution · Normal</h4>
    ${distHtml(normalBuckets, NORMAL_TIMES, maxNormal)}

    <h4>Solved-at distribution · Hard</h4>
    ${distHtml(hardBuckets, NORMAL_TIMES, maxHard)}

    <h4>Recent games</h4>
    <div style="display:flex;flex-direction:column;gap:6px;">${historyHtml}</div>

    ${stats.played ? '<button class="expand-btn" style="margin-top:14px;" onclick="resetStats()">Reset scores</button>' : ''}
  `;
  refreshContentAnim(pc);
}

// stop any playing snippet whenever the panel closes or a character opens
const _origClosePanel = closePanel;
closePanel = function () { stopSnippet(); _origClosePanel(); };
const _origOpenChar = openChar;
openChar = function (id) { stopSnippet(); _origOpenChar(id); };
</script>
</body>
</html>
